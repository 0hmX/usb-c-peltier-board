[env:general-pd]
platform = ststm32@19.3.0
board = general_pd_g0b1
board_build.ldscript = .pio/build/general-pd/general_pd.ld
framework = stm32cube
platform_packages =
  platformio/framework-stm32cubeg0@1.6.2
  platformio/toolchain-gccarmnoneeabi@1.120301.0
  platformio/tool-ldscripts-ststm32@0.2.0
lib_deps = https://github.com/hathach/tinyusb.git#0.18.0
lib_ignore = TinyUSB
extra_scripts = pre:tinyusb.py
build_flags = -std=gnu11 -Wall -Wextra -Werror -Wno-error=old-style-declaration
upload_protocol = stlink
